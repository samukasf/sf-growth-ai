name: Samuel Desktop Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/samuel-desktop-agent-v1
    paths:
      - "apps/samuel-desktop-agent/**"
      - ".github/workflows/samuel-desktop-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/samuel-desktop-agent
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/samuel-desktop-agent/package.json

      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript build
        run: npm run build

      - name: Build NSIS installer
        run: npm run dist:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Samuel-Desktop-Windows
          path: apps/samuel-desktop-agent/release/*.exe
          if-no-files-found: error
          retention-days: 14
