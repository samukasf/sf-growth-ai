name: Remotion Lockfile Bootstrap

on:
  push:
    branches:
      - feature/remotion-browser-video-20260930

permissions:
  contents: write

jobs:
  lockfile:
    if: "!contains(github.event.head_commit.message, '[lockfile]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Synchronize package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync Remotion lockfile [lockfile]"
          git push
