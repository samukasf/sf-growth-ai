name: Samuel Production Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/samuel-mobile/**"
      - "app/api/samuel-ai/mobile/**"
      - "app/api/samuel-ai/transcribe/**"
      - "app/api/samuel-ai/voice/**"
      - "app/api/samuel-desktop/**"
      - "features/auth/server/**"
      - "features/samuel-ai/desktop/**"
      - "features/samuel-ai/voice/**"
      - "proxy.ts"
      - ".github/workflows/samuel-production-smoke.yml"

permissions:
  contents: read

concurrency:
  group: samuel-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SAMUEL_BASE_URL: https://sf-growth-ai.vercel.app
    steps:
      - name: Wait for production mobile bootstrap config
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 36); do
            code=$(curl --silent --show-error --location \
              --output /tmp/samuel-auth-config.json \
              --write-out "%{http_code}" \
              "$SAMUEL_BASE_URL/api/samuel-ai/mobile/auth-config" || true)
            if [ "$code" = "200" ] && node -e '
              const fs=require("fs");
              const body=JSON.parse(fs.readFileSync("/tmp/samuel-auth-config.json","utf8"));
              if(!body.supabaseUrl || !body.supabaseAnonKey) process.exit(1);
            '; then
              ready=1
              break
            fi
            echo "Production not ready yet (attempt $attempt, HTTP $code)"
            sleep 10
          done
          if [ "$ready" != "1" ]; then
            echo "Samuel production auth bootstrap did not become healthy in time"
            exit 1
          fi

      - name: Verify protected Samuel API still rejects anonymous access
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --location \
            --output /tmp/samuel-protected.json \
            --write-out "%{http_code}" \
            "$SAMUEL_BASE_URL/api/samuel-ai/mobile/bootstrap?companyId=default-company")
          if [ "$code" != "401" ]; then
            echo "Expected HTTP 401 from protected mobile bootstrap, got $code"
            exit 1
          fi
          node -e '
            const fs=require("fs");
            const body=JSON.parse(fs.readFileSync("/tmp/samuel-protected.json","utf8"));
            if(body.code !== "AUTH_REQUIRED") process.exit(1);
          '

      - name: Verify public login surface
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --location \
            --output /dev/null \
            --write-out "%{http_code}" \
            "$SAMUEL_BASE_URL/login")
          test "$code" = "200"
