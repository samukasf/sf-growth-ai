name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "chore/**"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # @supabase/supabase-js requires native WebSocket (Node 22+)
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint with diagnostics
        id: lint
        shell: bash
        run: |
          set +e
          npm run lint 2>&1 | tee lint-output.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics
          path: lint-output.txt
          if-no-files-found: error
          retention-days: 1

      - name: Build
        run: npm run build

      - name: Enforce lint result
        if: steps.lint.outputs.exit_code != '0'
        run: exit 1
